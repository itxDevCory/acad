version: '3.8'

services:
  # Main application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: microsaas-academy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
    volumes:
      # Persist user data
      - ./data:/app/data
      - ./projects:/app/projects
      - ./models:/app/models
    restart: unless-stopped
    networks:
      - microsaas-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/chat', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL database
  # Uncomment if you need a database
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: microsaas-postgres
  #   environment:
  #     - POSTGRES_DB=microsaas_academy
  #     - POSTGRES_USER=microsaas
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - microsaas-network
  #   restart: unless-stopped

  # Optional: Redis for caching
  # Uncomment if you need caching
  # redis:
  #   image: redis:7-alpine
  #   container_name: microsaas-redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - microsaas-network
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis-data:/data

networks:
  microsaas-network:
    driver: bridge

volumes:
  # Uncomment if using PostgreSQL
  # postgres-data:
  # Uncomment if using Redis
  # redis-data:
